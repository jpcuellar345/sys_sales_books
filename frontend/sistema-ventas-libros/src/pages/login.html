<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio de Sesión</title>
    <!-- icons bootstrap styles -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <!-- personal styles -->
    <link rel="stylesheet" href="../css/media_queries.css">
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/componentes.css">
    
    <!-- login -->
    <script src="../js/login.js" defer></script>
</head>

<body>
    <header>
        <div id="contenedor_presentacion_empresa">
            <i class="bi bi-book-half"></i>
            <h1 id="nombre_empresa">Libreria Ficticia</h1>
        </div>
    </header>
    <div class="main_container">
        <main>
            <form id="form_login">
                <h2 class="fuente_fondo_blanco">Inicio de Sesión</h2>
                <label class="fuente_fondo_blanco" for="username">Usuario:</label>
                <input type="text" id="username" name="username" placeholder="Digita tu nombre usuario o telefono"
                    required>
                <label class="fuente_fondo_blanco" for="password">Contraseña:</label>

                <div class="password_field">
                    <input type="password" id="password" name="password" placeholder="Digita tu contraseña" required>
                    <button type="button" class="toggle_password">
                        <i class="bi bi-eye-slash login_icono_bootstrap"></i>
                    </button>
                </div>

                <div id="contenedor_formas_logis">
                    <p class="fuente_fondo_blanco">Continuar con:</p>
                    <button type="button" data-proveedor="facebook">
                        <i class="bi bi-facebook login_icono_bootstrap"></i>
                    </button>
                    <button type="button" data-proveedor="x">
                        <i class="bi bi-twitter-x login_icono_bootstrap"></i>
                    </button>
                    <button type="button" data-proveedor="google">
                        <i class="bi bi-google login_icono_bootstrap"></i>
                    </button>
                </div>
                <button type="submit">Ingresar</button>
                <div id="contenedor_opciones_cuenta" class="fuente_fondo_blanco">
                    <p class="opciones_cuenta"><a href="recuperar_pass.html">¿Olvidaste tu contraseña?</a> o <a
                            href="registrarse.html">Regístrate</a></p>
                </div>
            </form>
        </main>
    </div>
</body>

</html>
